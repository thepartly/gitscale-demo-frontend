apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/thepartly/gitscale-demo/frontend
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: frontend
          readinessProbe:
            httpGet:
              path: /
              port: http
