# How frontend runs in the local stack: from its image, and under x-build —
# which compose ignores — from its working tree, Vite reloading through the
# same port. See compose's README. Its variables are deploy/app.env, the file
# Kubernetes reads too.
x-build:
  frontend:
    run: "[ -d node_modules ] || npm ci --no-audit --no-fund; npm run dev -- --host 0.0.0.0 --port 80 --strictPort"

services:
  frontend:
    image: ghcr.io/thepartly/gitscale-demo/frontend:${GITSCALE_DEMO_FRONTEND_TAG:?}
    ports: ["8080:80"]
    env_file: ${GITSCALE_DEMO_FRONTEND_DIR:?}/deploy/app.env
    depends_on: [application-a, application-b]
